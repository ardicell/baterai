          # Kotlin client
          cat > app-client/src/main/kotlin/com/example/client/MainActivity.kt << 'EOF'
          package com.example.client
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.concurrent.thread
          class MainActivity : AppCompatActivity() {
              private lateinit var tvBatteryLevel: TextView
              private lateinit var tvChargerStatus: TextView
              private lateinit var tvChargingSpeed: TextView
              private lateinit var tvTemperature: TextView
              private lateinit var tvVoltage: TextView
              private lateinit var tvCpuTemp: TextView
              private lateinit var tvDataRx: TextView
              private lateinit var tvDataTx: TextView
              private lateinit var tvSmsUnread: TextView
              private lateinit var tvLastSms: TextView
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var adapter: NotificationAdapter
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  tvBatteryLevel = findViewById(R.id.tvBatteryLevel)
                  tvChargerStatus = findViewById(R.id.tvChargerStatus)
                  tvChargingSpeed = findViewById(R.id.tvChargingSpeed)
                  tvTemperature = findViewById(R.id.tvTemperature)
                  tvVoltage = findViewById(R.id.tvVoltage)
                  tvCpuTemp = findViewById(R.id.tvCpuTemp)
                  tvDataRx = findViewById(R.id.tvDataRx)
                  tvDataTx = findViewById(R.id.tvDataTx)
                  tvSmsUnread = findViewById(R.id.tvSmsUnread)
                  tvLastSms = findViewById(R.id.tvLastSms)
                  val rv = findViewById<RecyclerView>(R.id.rvNotifications)
                  adapter = NotificationAdapter()
                  rv.layoutManager = LinearLayoutManager(this)
                  rv.adapter = adapter
                  handler.post(updateRunnable)
              }
              private val updateRunnable = object : Runnable {
                  override fun run() {
                      fetchData()
                      handler.postDelayed(this, 5000)
                  }
              }
              private fun fetchData() {
                  thread {
                      try {
                          val url = URL("http://192.168.43.1:8080/status")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.connectTimeout = 3000
                          conn.readTimeout = 3000
                          val json = conn.inputStream.bufferedReader().readText()
                          conn.disconnect()
                          val root = JSONObject(json)
                          val battery = root.getJSONObject("battery")
                          val sms = root.getJSONObject("sms")
                          val notifs = root.getJSONArray("notifications")
                          val dataUsage = root.optJSONObject("data_usage")

                          runOnUiThread {
                              tvBatteryLevel.text = "Baterai: ${battery.getInt("level")}%"
                              tvChargerStatus.text = "Charger: ${battery.getString("plugged")} ${if(battery.getBoolean("charging")) "(mengisi)" else ""}"
                              val cur = battery.optInt("charge_current", -1)
                              tvChargingSpeed.text = if (cur > 0) "Arus: ${cur} mA" else "Kecepatan tidak diketahui"
                              tvTemperature.text = "Suhu baterai: ${battery.getDouble("temperature")}°C"
                              tvVoltage.text = "Tegangan: ${battery.getInt("voltage")} mV"
                              tvCpuTemp.text = if (root.has("cpu_temperature")) "Suhu CPU: ${root.getDouble("cpu_temperature")}°C" else "Suhu CPU: --"

                              if (dataUsage != null) {
                                  val rxMB = String.format("%.2f", dataUsage.getDouble("rx_mb"))
                                  val txMB = String.format("%.2f", dataUsage.getDouble("tx_mb"))
                                  tvDataRx.text = "Download: $rxMB MB"
                                  tvDataTx.text = "Upload: $txMB MB"
                              } else {
                                  tvDataRx.text = "Download: -- MB"
                                  tvDataTx.text = "Upload: -- MB"
                              }

                              tvSmsUnread.text = "SMS belum dibaca: ${sms.getInt("unread_count")}"
                              tvLastSms.text = if (sms.getString("last_sender").isNotEmpty()) "${sms.getString("last_sender")}: ${sms.getString("last_body")}" else "Tidak ada SMS baru"
                              val items = mutableListOf<Map<String, String>>()
                              for (i in 0 until notifs.length()) {
                                  val n = notifs.getJSONObject(i)
                                  items.add(mapOf(
                                      "app" to n.getString("app"),
                                      "title" to n.getString("title"),
                                      "text" to n.getString("text"),
                                      "time" to SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date(n.getLong("time")))
                                  ))
                              }
                              adapter.submitList(items)
                          }
                      } catch (e: Exception) {
                          runOnUiThread { Toast.makeText(this@MainActivity, "Gagal terhubung ke server", Toast.LENGTH_SHORT).show() }
                      }
                  }
              }
          }
          EOF

          cat > app-client/src/main/kotlin/com/example/client/NotificationAdapter.kt << 'EOF'
          package com.example.client
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          class NotificationAdapter : RecyclerView.Adapter<NotificationAdapter.ViewHolder>() {
              private var items = listOf<Map<String, String>>()
              fun submitList(list: List<Map<String, String>>) { items = list; notifyDataSetChanged() }
              class ViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                  val app: TextView = view.findViewById(R.id.tvNotifApp)
                  val title: TextView = view.findViewById(R.id.tvNotifTitle)
                  val text: TextView = view.findViewById(R.id.tvNotifText)
                  val time: TextView = view.findViewById(R.id.tvNotifTime)
              }
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =
                  ViewHolder(LayoutInflater.from(parent.context).inflate(R.layout.item_notification, parent, false))
              override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                  val item = items[position]
                  holder.app.text = item["app"]
                  holder.title.text = item["title"]
                  holder.text.text = item["text"]
                  holder.time.text = item["time"]
              }
              override fun getItemCount() = items.size
          }
          EOF

